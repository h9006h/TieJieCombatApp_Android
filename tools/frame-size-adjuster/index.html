<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>铁街人物帧大小生成器 · Android Web</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#070a0c;color:#e6d4b5;font-family:system-ui,"Microsoft YaHei",sans-serif}body{padding:18px;background:radial-gradient(circle at 38% 5%,#243035,#070a0c 55%)}header{display:flex;align-items:end;justify-content:space-between;gap:16px;max-width:1400px;margin:auto;padding:14px 18px;border:1px solid #754c32;background:#0d1417}header h1{margin:0;color:#f0cf9c;font-size:25px;letter-spacing:3px}header p{margin:5px 0 0;color:#899798;font-size:13px}header code{color:#d58751}.app{display:grid;grid-template-columns:minmax(580px,1.35fr) minmax(360px,.65fr);gap:14px;max-width:1400px;margin:14px auto}.panel{border:1px solid #465154;background:#0b1114;padding:14px}.preview{display:flex;flex-direction:column;min-height:700px}canvas{width:100%;height:min(68vh,720px);background:#11191c;border:1px solid #394548}.nav,.actions{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:10px}.nav strong{text-align:center;color:#efb971}.controls{display:flex;flex-direction:column;gap:13px;max-height:calc(100vh - 135px);overflow:auto}.controls label{display:grid;grid-template-columns:100px 1fr 70px;align-items:center;gap:8px;color:#cbb996;font-weight:800;font-size:13px}.controls select,.controls input[type=number]{min-height:38px;padding:6px;border:1px solid #61503b;background:#070c0e;color:#f5dfb7}.controls select{grid-column:2/4}.controls input[type=range]{grid-column:1/4;width:100%;accent-color:#d15a2d}.controls output{text-align:right;color:#efb971}.flip{display:flex!important;grid-template-columns:none!important;gap:9px!important}.flip input{width:20px;height:20px;accent-color:#d15a2d}button{min-height:42px;padding:9px 14px;border:1px solid #6c5a42;background:#1b292d;color:#ead9bc;font-weight:900;cursor:pointer}button:hover{border-color:#d59658}.primary{background:#74361f;border-color:#bd6e42}.danger{background:#321918;border-color:#773e31}.actions{grid-template-columns:1fr 1fr 1fr}.status{min-height:52px;padding:10px;border-left:4px solid #5d7477;background:#10191c;color:#aebbbb;font-size:13px;line-height:1.55}.status.ok{border-color:#65a96f;color:#bfe3c4}.status.error{border-color:#c84d3d;color:#efb2a7}.help{color:#829091;font-size:12px;line-height:1.65}.dirty{color:#f0ad64}@media(max-width:980px){.app{grid-template-columns:1fr}.preview{min-height:560px}.controls{max-height:none}}
</style></head><body><header><div><h1>人物帧大小生成器</h1><p>桌面独立版 · 直接调整 Android 项目的 <code>src-web/game.js</code></p></div><div id="dirty"></div></header><main class="app"><section class="panel preview"><canvas id="canvas" width="820" height="720"></canvas><div class="nav"><button id="prev">上一帧</button><strong id="frameLabel">第 1 / 1 帧</strong><button id="next">下一帧</button></div></section><section class="panel controls"><label>动作组<select id="group"></select></label><label>缩放<output id="scaleOut">1.00</output><input id="scale" type="range" min="0.10" max="1.60" step="0.01"><input id="scaleNum" type="number" min="0.10" max="1.60" step="0.01"></label><label>横向偏移<output id="xOut">0</output><input id="x" type="range" min="-160" max="160" step="1"><input id="xNum" type="number" min="-160" max="160" step="1"></label><label>纵向偏移<output id="yOut">0</output><input id="y" type="range" min="-160" max="160" step="1"><input id="yNum" type="number" min="-160" max="160" step="1"></label><label class="flip"><input id="flip" type="checkbox">水平翻转当前帧</label><div class="actions"><button id="reset">还原当前帧</button><button id="reload" class="danger">放弃未保存修改</button><button id="save" class="primary">保存到源码</button></div><div id="status" class="status">正在读取 Android Web 源码……</div><div class="help">保存时会先备份当前 <code>game.js</code>，然后只更新缩放、偏移、翻转三组配置。工具不会修改 <code>www</code>，也不会执行 Capacitor 同步或 Android 打包。调整完成后仍由你运行 <code>npm run build:web</code> 和 <code>npx cap copy android</code>。</div></section></main><script>
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d');let state=null,original=null,frame=0,image=null,dirty=false;
function clone(v){return JSON.parse(JSON.stringify(v))}function selected(){return $('group').value}function count(){return state.scales[selected()]?.length||1}function setStatus(text,type=''){const node=$('status');node.textContent=text;node.className=`status ${type}`}function setDirty(value=true){dirty=value;$('dirty').innerHTML=value?'<strong class="dirty">● 有未保存修改</strong>':'<span>源码已同步</span>'}
async function load(){setStatus('正在读取 Android Web 源码……');const response=await fetch('/api/config',{cache:'no-store'}),data=await response.json();if(!response.ok)throw new Error(data.error);state={scales:data.scales,offsets:data.offsets,flips:data.flips,groups:data.groups};original=clone(state);$('group').innerHTML='';for(const [key,item]of Object.entries(state.groups)){const option=document.createElement('option');option.value=key;option.textContent=item.label;$('group').appendChild(option)}frame=0;setDirty(false);await loadImage();setStatus(`已连接：${data.gameFile}`,'ok')}
async function loadImage(){const key=selected(),src=state.groups[key].path;image=new Image();await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=()=>reject(new Error(`无法加载素材：${src}`));image.src=`${src}?t=${Date.now()}`});frame=Math.min(frame,count()-1);render()}
function render(){const key=selected(),frames=count(),scale=state.scales[key][frame],[x,y]=state.offsets[key][frame],flip=state.flips[key][frame],sw=image.naturalWidth/frames,sh=image.naturalHeight,zoom=Math.min((canvas.width-100)/(sw*1.6),(canvas.height-80)/(sh*1.6)),baseline=canvas.height-35;ctx.clearRect(0,0,canvas.width,canvas.height);for(let yy=0;yy<canvas.height;yy+=28)for(let xx=0;xx<canvas.width;xx+=28){ctx.fillStyle=(xx/28+yy/28)%2?'#11191c':'#182225';ctx.fillRect(xx,yy,28,28)}ctx.strokeStyle='#d16b3f';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(20,baseline);ctx.lineTo(canvas.width-20,baseline);ctx.stroke();ctx.strokeStyle='#71878a88';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(canvas.width/2,18);ctx.lineTo(canvas.width/2,baseline);ctx.stroke();const dw=sw*scale*zoom,dh=sh*scale*zoom;ctx.save();ctx.translate(canvas.width/2+x*zoom,baseline+y*zoom);ctx.scale(flip?-1:1,1);ctx.drawImage(image,frame*sw,0,sw,sh,-dw/2,-dh+40*scale*zoom,dw,dh);ctx.restore();$('frameLabel').textContent=`第 ${frame+1} / ${frames} 帧`;syncControls(scale,x,y,flip)}
function syncControls(scale,x,y,flip){for(const id of['scale'])$(id).value=scale;$('scaleNum').value=Number(scale).toFixed(2);$('scaleOut').textContent=Number(scale).toFixed(2);$('x').value=x;$('xNum').value=x;$('xOut').textContent=x;$('y').value=y;$('yNum').value=y;$('yOut').textContent=y;$('flip').checked=flip}
function apply(){const key=selected(),scale=Math.max(.1,Math.min(1.6,Number($('scaleNum').value)||1)),x=Math.max(-160,Math.min(160,Math.round(Number($('xNum').value)||0))),y=Math.max(-160,Math.min(160,Math.round(Number($('yNum').value)||0)));state.scales[key][frame]=Math.round(scale*100)/100;state.offsets[key][frame]=[x,y];state.flips[key][frame]=$('flip').checked;setDirty();render()}
$('group').onchange=async()=>{frame=0;try{await loadImage()}catch(error){setStatus(error.message,'error')}};$('prev').onclick=()=>{frame=(frame-1+count())%count();render()};$('next').onclick=()=>{frame=(frame+1)%count();render()};for(const [slider,num]of[['scale','scaleNum'],['x','xNum'],['y','yNum']]){$(slider).oninput=()=>{$(num).value=$(slider).value;apply()};$(num).onchange=apply}$('flip').onchange=apply;$('reset').onclick=()=>{const key=selected();state.scales[key][frame]=original.scales[key][frame];state.offsets[key][frame]=clone(original.offsets[key][frame]);state.flips[key][frame]=original.flips[key][frame];setDirty();render()};$('reload').onclick=()=>load().catch(error=>setStatus(error.message,'error'));
$('save').onclick=async()=>{try{setStatus('正在备份并写入 src-web/game.js……');const response=await fetch('/api/save',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(state)}),data=await response.json();if(!response.ok)throw new Error(data.error);original=clone(state);setDirty(false);setStatus(`保存成功。备份：${data.backup}`,'ok')}catch(error){setStatus(`保存失败：${error.message}`,'error')}};addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue=''}});load().catch(error=>setStatus(error.message,'error'));
</script></body></html>
